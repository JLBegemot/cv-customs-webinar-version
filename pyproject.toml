[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cv-customs-webinar-version"
version = "0.1.0"
description = "Simplified CV storage service: auth, file upload, user settings (local-only)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    # multipart-формы (upload файлов)
    "python-multipart>=0.0.18",
    "python-dotenv>=1.0.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "pydantic-settings>=2.5.0",
    "python-jose[cryptography]>=3.5.0",
    "email-validator>=2.3.0",
    "bcrypt>=5.0.0",
    "structlog>=24.4.0",
    "aioboto3>=13.0.0",
    "httpx>=0.27.0",
    # MFA (feature-flagged behind FEATURE_MFA)
    "pyotp>=2.9.0",
    "qrcode[pil]>=7.4.2",
]

[project.optional-dependencies]
test = [
    "pytest>=8.4.0",
    "pytest-asyncio>=0.24.0",
    "aiosqlite>=0.20.0",
    "reportlab>=4.2.0",       # tiny PDF fixtures for upload tests
]
# `dev` is a convenience alias — installs everything needed for local
# development (tests + dev-only tooling). Keep in sync with `test`.
dev = [
    "pytest>=8.4.0",
    "pytest-asyncio>=0.24.0",
    "aiosqlite>=0.20.0",
    "reportlab>=4.2.0",
    "ruff>=0.8.0",            # formatter, вызывается хуком PostToolUse
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# `case` — связь с тест-планом в plans/ (TC-NNN).
markers = [
    "case(id): идентификатор кейса из тест-плана, например 'TC-004'",
]

[tool.ruff]
line-length = 88
target-version = "py312"
extend-exclude = ["alembic/versions", ".venv", "venv"]

[tool.hatch.build.targets.wheel]
packages = ["backend/src/cv_customs"]
